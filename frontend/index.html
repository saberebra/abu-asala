<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8c0000">
<title>فطاطري أبو أصالة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script defer src="js/config.js"></script>
<script defer src="js/app.js"></script>
</head>
<body>

<section class="page active" id="p1">
  <div id="chilies"></div>
  <img id="logo" alt="فطاطري أبو أصالة" src="assets/logo.png">
  <button class="cta" id="start">اطلب دلوقتي</button>
  <div class="credit">Designed by: <a href="https://www.facebook.com/share/1A1Pd1TJ3L/" target="_blank" rel="noopener noreferrer">Eng. Mahmoud Saber</a></div>
</section>

<section class="page" id="p2">
  <header class="top"><button class="back" data-back aria-label="رجوع">→</button><h1>اختار القسم</h1></header>
  <div class="wrap"><div class="grid" id="cats"></div></div>
</section>

<section class="page" id="ps">
  <header class="top"><button class="back" data-back aria-label="رجوع">→</button><h1 id="sttl"></h1></header>
  <div class="wrap"><div class="grid" id="subs"></div></div>
</section>

<section class="page" id="p3">
  <header class="top"><button class="back" data-back aria-label="رجوع">→</button><h1 id="ttl"></h1></header>
  <div class="wrap"><div class="grid" id="grid"></div></div>
</section>

<section class="page" id="p4">
  <header class="top"><button class="back" data-back aria-label="رجوع">→</button><h1>طلبك</h1></header>
  <div class="wrap">
    <div class="sheet"><h2>الأصناف</h2><ul id="sum"></ul>
      <div class="row"><span>حساب الأصناف</span><b id="sub"></b></div>
      <div class="row"><span>التوصيل</span><b id="dlv"></b></div>
      <div class="row big"><span>الإجمالي</span><b id="gt"></b></div></div>
    <div class="sheet"><h2>بيانات التوصيل</h2>
      <input id="fn" placeholder="الاسم" autocomplete="name">
      <input id="fp" placeholder="رقم الموبايل" inputmode="tel" autocomplete="tel">
      <input id="fa" placeholder="العنوان بالتفصيل" autocomplete="street-address">
      <textarea id="fm" rows="2" placeholder="ملاحظات (اختياري)"></textarea>
      <p id="err" role="alert"></p></div>
  </div>
  <div class="foot"><button class="green" id="send">ابعت الطلب</button></div>
</section>

<div class="bar" id="bar">
  <div class="grab" id="grab" aria-label="اسحب لعرض الأصناف"><i></i></div>
  <div class="blist" id="blist"></div>
  <div class="tot"><div><small>الإجمالي</small><b id="btot"></b></div><button class="clr" id="clear">مسح الكل</button></div>
  <button class="green" id="view">شوف الطلب</button>
</div>

<div id="done"><div class="success-icon">✅</div><h2>وصل طلبك!</h2><button class="cta" id="again">رجوع للبداية</button></div>
<div id="menuState" class="on" role="status" aria-live="polite"><div class="state-card"><div class="state-icon">🍽️</div><h2 id="stateTitle">المنيو متوقف</h2><p id="stateMessage">المنيو غير متاح حاليًا. يرجى المحاولة مرة أخرى لاحقًا.</p><button id="retryMenu" type="button">إعادة المحاولة</button></div></div>

</body>
</html>
